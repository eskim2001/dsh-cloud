name: Instance image

# Manual trigger only: the tag is immutable and VERSION is the single knob. Editing the
# Dockerfile either trips the guard below (red) or forces a new tag to bypass it (drift).
# A release must be a deliberate act: a human bumping the revision number.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instance-image-${{ github.ref }}
  # No concurrent releases: cancelling an in-flight push is worse than queueing.
  cancel-in-progress: false

jobs:
  build:
    # Each arch builds on a native runner (ARM runners are free for public repos) instead
    # of QEMU, so native modules like node-pty are not compiled under emulated arm64.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # Required for type=gha cache export. The docs do not mandate it, but an explicit
      # permissions block turns unlisted scopes into none, which can 403 cache uploads.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VERSION=$(tr -d '[:space:]' < docker/instance-image/VERSION)
          DSH_VERSION=${VERSION%_*}
          REVISION=${VERSION##*_}
          if [ -z "$DSH_VERSION" ] || [ "$DSH_VERSION" = "$VERSION" ] || ! [[ "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Bad VERSION format: expected <dsh-version>_<revision> (e.g. 0.1.2-rc.1_1), got '$VERSION'" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dsh_version=$DSH_VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Refuse an existing tag: the same tag holding different bytes makes the ref recorded
      # on each instance meaningless (D22). Both matrix legs check; the merge job creates it.
      - name: Refuse to overwrite an existing tag
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          TOKEN=$(curl -sS -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:eskim2001/dsh-instance:pull" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "No GHCR token (package does not exist yet) - treating as a first push"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/eskim2001/dsh-instance/manifests/$TAG")
          case "$CODE" in
            200)
              echo "tag $TAG already exists - bump the revision in docker/instance-image/VERSION." >&2
              exit 1
              ;;
            404 | 401)
              echo "tag $TAG does not exist, continuing"
              ;;
            *)
              echo "GHCR query failed: HTTP $CODE" >&2
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest, no tag: the merge job creates the tag once both arches succeed,
      # so a mid-flight failure cannot leave a single-arch tag behind.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: docker/instance-image
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/eskim2001/dsh-instance,push-by-digest=true,name-canonical=true,push=true
          # Scope per arch: the default scope is "buildkit" and the two matrix legs run
          # concurrently, so a shared scope would make them overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }}
          build-args: |
            DSH_VERSION=${{ steps.v.outputs.dsh_version }}
            REVISION=${{ steps.v.outputs.revision }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.v.outputs.build_time }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both arches are required: fail rather than silently publish a single-arch tag.
      # The digest lives in the file NAME (Export digest touches empty files), not content.
      - name: Merge digests into one tag
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < docker/instance-image/VERSION)
          count=$(ls /tmp/digests | wc -l | tr -d ' ')
          if [ "$count" != "2" ]; then
            echo "Expected 2 arch digests, got $count - aborting without creating a tag" >&2
            exit 1
          fi
          images=""
          for f in /tmp/digests/*; do
            digest=$(basename "$f")
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "digest filename does not look like sha256: $digest" >&2
              exit 1
            fi
            images="$images ghcr.io/eskim2001/dsh-instance@sha256:$digest"
          done
          echo "Merging:$images"
          docker buildx imagetools create -t "ghcr.io/eskim2001/dsh-instance:$VERSION" $images
          echo "Published ghcr.io/eskim2001/dsh-instance:$VERSION (amd64 + arm64)"

      - name: Summary
        run: |
          {
            echo "### Pushed \`ghcr.io/eskim2001/dsh-instance:$(tr -d '[:space:]' < docker/instance-image/VERSION)\` (linux/amd64 + linux/arm64)"
            echo
            echo "After the first push, set the package to Public (new GHCR packages default to private):"
            echo "https://github.com/users/eskim2001/packages/container/dsh-instance/settings"
          } >> "$GITHUB_STEP_SUMMARY"
