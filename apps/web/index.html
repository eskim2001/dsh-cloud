<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/dshcloud-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/dshcloud-touch.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>dshcloud console</title>
    <script>
      // 在首屏渲染前定色，否则暗色模式下会闪一下白底
      ;(function () {
        try {
          var stored = localStorage.getItem('dsh-cloud.theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          // 无痕模式下 localStorage 可能抛异常，忽略即可
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
