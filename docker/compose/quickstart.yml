# 零证书的本地入口栈：只开 :80，明文。
#
# 给「clone 下来最快跑通」用——不需要签证书、不需要装信任库，一条命令起。
# 代价是 cookie 不带 `Secure`、TLS 不在链路上，所以它**只适合本地**。
#
# 要和它对齐的控制面配置（apps/server/.env.local）：
#   BASE_DOMAIN=lvh.me
#   CONSOLE_DOMAIN=console.lvh.me
#   PUBLIC_SCHEME=http
#   TRAEFIK_ENTRYPOINT=web
#   TRAEFIK_CERT_RESOLVER=            # 明文档用不到
#   TRAEFIK_CONTAINER=dsh-ingress
#   FORWARD_AUTH_ADDRESS=http://host.docker.internal:3000/auth/verify
#   TRAEFIK_ROUTES_PATH=./traefik-dynamic/routes.yml
#
# 生产同构的那一档（:443 + 自签证书 + Secure cookie）在 local.yml——**验认证链路要用那个**，
# 因为只有它覆盖「cookie 带 Secure」「TLS 终结在入口」这些线上真实条件。
#
# 域名是 console.lvh.me（控制台）+ <slug>.lvh.me（实例）：`*.lvh.me` 是公共通配
# DNS（全网解析到 127.0.0.1），所以**不需要本地 DNS 容器**，也不会和 Clash 之类
# 占用 :53 的程序撞车。不能用 `.localhost`——Chrome 不认 `Domain=.localhost`。
#
# 实例容器**不发布任何宿主端口**（铁律 6①）：控制面把 Traefik 接进每个实例
# 网络（TRAEFIK_CONTAINER），它按容器名直连实例桥。只有 forward-auth 那一跳
# 仍经 host.docker.internal 摸宿主上的控制面。
#
# 跑法见 docker/compose/README.md。控制面需要的环境变量在 apps/server/.env.local。
services:
  traefik:
    image: traefik:v3.5
    # 控制面按这个名字把入口接进实例网络（TRAEFIK_CONTAINER 的默认值）
    container_name: dsh-ingress
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
    extra_hosts:
      # forward-auth 要摸宿主回环上的控制面（实例后端走 Docker 网络，不用这个）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # 控制面生成的实例路由（apps/server/traefik-dynamic/routes.yml）
      - ../../apps/server/traefik-dynamic:/etc/traefik/dynamic
      # 控制台自己的域名（登录页 / API）——开发态指向 Vite，明文
      - ../traefik/dynamic-quickstart/platform.yml:/etc/traefik/dynamic/platform.yml:ro
