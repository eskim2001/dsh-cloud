# 本地验证栈：Traefik 接入 + 认证前置。
#
# 拓扑刻意和生产一致，只有一处差异：
#   - 控制面（apps/server）跑在**宿主**上（tsx 直跑，改代码即生效），不在容器里。
#
# TLS 按生产那套走（:443 的 `websecure`），证书换成**自签**的静态证书
# （../traefik/dynamic-dev/tls.yml，签发命令见 README）。浏览器会红锁，
# 点「继续访问」即可；想消掉红锁就把自签 CA 装进系统信任库。
#
# 域名是 platform.lvh.me：`*.lvh.me` 是公共通配 DNS（全网解析到 127.0.0.1），
# 所以**不需要本地 DNS 容器**，也不会和 Clash 之类占用 :53 的程序撞车。
#
# 实例容器**不发布任何宿主端口**（铁律 6①）：控制面把 Traefik 接进每个实例
# 网络（TRAEFIK_CONTAINER），它按容器名直连实例桥。只有 forward-auth 那一跳
# 仍经 host.docker.internal 摸宿主上的控制面。
#
# 跑法见 docker/compose/README.md。控制面需要的环境变量在 apps/server/.env.local。
services:
  traefik:
    image: traefik:v3.5
    # 控制面按这个名字把入口接进实例网络（TRAEFIK_CONTAINER 的默认值）
    container_name: dsh-ingress
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # forward-auth 要摸宿主回环上的控制面（实例后端走 Docker 网络，不用这个）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # 控制面生成的实例路由（apps/server/traefik-dynamic/routes.yml）
      - ../../apps/server/traefik-dynamic:/etc/traefik/dynamic
      # 平台自己的域名（登录页 / API）——开发态指向 Vite
      - ../traefik/dynamic-dev/platform.yml:/etc/traefik/dynamic/platform.yml:ro
      # 自签证书（目录在 .gitignore 里，私钥不进仓库；签发命令见 README）
      - ../traefik/certs:/etc/traefik/certs:ro
      - ../traefik/dynamic-dev/tls.yml:/etc/traefik/dynamic/tls.yml:ro
