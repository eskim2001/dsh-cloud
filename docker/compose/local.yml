# 本地开发全栈：Postgres + Traefik 接入 + 认证前置。
#
# 正常由根目录的 `pnpm dev` 拉起——它会等 Postgres 就绪、跑迁移和 seed，再起控制面和管理台。
# 手工起也行：docker compose -f docker/compose/local.yml up -d（停：... down）。
#
# 拓扑刻意和生产一致，只有一处差异：
#   - 控制面（apps/server）跑在**宿主**上（tsx 直跑，改代码即生效），不在容器里。
#
# TLS 按生产那套走（:443 的 `websecure`），但**不配证书**——Traefik 没配到证书时回落到它
# 内置的默认自签证书。浏览器会红锁，且证书名和 lvh.me 对不上，点「继续访问」即可；
# 想要绿锁就自己签一张 SAN 覆盖 lvh.me / *.lvh.me 的证书装进系统信任库。
#
# 域名是 console.lvh.me（控制台）+ <slug>.lvh.me（实例）：`*.lvh.me` 是公共通配
# DNS（全网解析到 127.0.0.1），所以**不需要本地 DNS 容器**，也不会和 Clash
# 之类占用 :53 的程序撞车。
#
# 实例**挂在宿主回环端口上** `127.0.0.1:<hostPort>`：端口由控制面从 20000-31999
# 分配（apps/server/src/instance/port-allocator.ts）。
# Traefik 跑在容器里，所以两跳都走 host.docker.internal——实例后端
# （INSTANCE_UPSTREAM_HOST，见 scripts/dev.mjs）和 forward-auth（宿主上的控制面）。
#
# 跑法见 docker/compose/README.md。控制面需要的环境变量在 apps/server/.env.local
# （`pnpm dev` 在它缺失时会自动生成）。
services:
  traefik:
    image: traefik:v3.5
    # 固定容器名，方便 `docker logs dsh-ingress` 之类
    container_name: dsh-ingress
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # 实例后端和 forward-auth 两跳都走它（见文件头）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # 控制面生成的实例路由（apps/server/traefik-dynamic/routes.yml）
      - ../../apps/server/traefik-dynamic:/etc/traefik/dynamic
      # 控制台自己的域名（登录页 / API）——开发态指向 Vite
      - ../traefik/dynamic-dev/platform.yml:/etc/traefik/dynamic/platform.yml:ro

  # 开发用的数据库。控制面跑在宿主上，所以只绑回环、DSN 是 127.0.0.1:55432。
  # 数据进 named volume：`down` 不丢，`down -v` 才清空。
  postgres:
    image: postgres:16-alpine
    container_name: dsh-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: dshcloud
      POSTGRES_PASSWORD: dshcloud
      POSTGRES_DB: dsh_cloud
    volumes:
      - dsh-pgdata:/var/lib/postgresql/data
    # 给 `pnpm dev` 用：靠它等「真能连」，而不是固定 sleep
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dshcloud -d dsh_cloud"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dsh-pgdata:
