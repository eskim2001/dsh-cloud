# 控制台自己的域名（登录页 / API）——【明文档】指向 Vite 管理台。
#
# 和 dynamic-dev/platform.yml 的唯一差别：挂在 `web`（:80）上、不写 `tls: {}`。
# 那一档走 websecure + 自签证书（生产同构，验认证链路用）；这一档零证书，
# 给「clone 下来最快跑起来」用——见 docker/compose/quickstart.yml。
#
# 用 console.lvh.me 而不是 localhost：Chrome 不认 `Domain=.localhost`，
# 跨子域登录态在浏览器里测不出来（详见 docker/compose/README.md）。
#
# 也**不能**用 lvh.me 本身：那样控制台主机名落在实例命名空间里（`<slug>.lvh.me`），
# 可以被租户抢注成同长度的 router 规则。
http:
  routers:
    platform-web:
      rule: Host(`console.lvh.me`)
      # 显式优先级：Traefik 默认按规则长度排序，长度相同则行为未定义。
      # 实例规则（`Host(`<slug>.lvh.me`)`）长度随 slug 变化，不能靠"刚好更长"。
      # 有这条，即使 slug 撞上控制台 label，控制台也稳赢。见 DECISIONS 的域名拆分 ADR。
      priority: 1000
      service: platform-web
      entryPoints: [web]
  services:
    platform-web:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:5173
